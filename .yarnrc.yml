changesetBaseRefs:
  - main
  - upstream/main
  - origin/main

compressionLevel: mixed

initScope: uppy

nodeLinker: node-modules

npmMinimalAgeGate: 2880

npmPublishAccess: public

# Auth for publishing @massif-network/* to GitHub Packages.
# NODE_AUTH_TOKEN is provided by the publish workflow (GITHUB_TOKEN); empty
# locally, which is fine since @massif-network packages resolve from the workspace.
npmRegistries:
  "https://npm.pkg.github.com":
    npmAlwaysAuth: true
    npmAuthToken: "${NODE_AUTH_TOKEN:-}"
