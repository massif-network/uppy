name: Check @massif-network/smugmug version bump

# Fails a PR into main if it changes the SmugMug client plugin without bumping
# its version — so "forgot to bump" is caught at review time, before the publish
# workflow would hit a duplicate-version error on GitHub Packages.
#
# Runs on every PR to main (no paths filter) so it always reports a status and
# can be a required check; it self-skips when the plugin is untouched.
on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  version-bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require a version bump when the plugin changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          PKG="packages/@massif-network/smugmug"

          if git diff --quiet "$BASE_SHA" HEAD -- "$PKG"; then
            echo "✓ $PKG is unchanged in this PR — no version bump required."
            exit 0
          fi

          PR_VER=$(node -p "require('./$PKG/package.json').version")

          if git cat-file -e "$BASE_SHA:$PKG/package.json" 2>/dev/null; then
            git show "$BASE_SHA:$PKG/package.json" > /tmp/base-pkg.json
            BASE_VER=$(node -p "require('/tmp/base-pkg.json').version")
          else
            echo "✓ $PKG is new on this branch (version $PR_VER)."
            exit 0
          fi

          echo "main version: $BASE_VER"
          echo "PR version:   $PR_VER"

          greatest=$(printf '%s\n%s\n' "$BASE_VER" "$PR_VER" | sort -V | tail -1)
          if [ "$PR_VER" = "$BASE_VER" ] || [ "$greatest" != "$PR_VER" ]; then
            echo "::error::$PKG changed but its version ($PR_VER) is not greater than main ($BASE_VER). Bump \"version\" in $PKG/package.json."
            exit 1
          fi

          echo "✓ version bumped: $BASE_VER -> $PR_VER"
