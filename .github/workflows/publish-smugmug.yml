name: Publish @massif-network/smugmug

# Manual publish of just @massif-network/smugmug to GitHub Packages, so
# massif-network/massif can depend on it. The upstream "publish everything"
# release workflow stays disabled (release.yml_).
#
# Run it FROM main             -> publishes package.json's version under `latest`
#                                 (bump "version" before merging to cut a release).
# Run it from any OTHER branch -> publishes <version>-rc.<run_number> under `rc`,
#                                 so branch builds never clobber the stable release.
on:
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

defaults:
  run:
    working-directory: packages/@massif-network/smugmug

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable
        working-directory: .

      - name: Determine version & dist-tag
        id: ver
        run: |
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          else
            base=$(node -p "require('./package.json').version")
            npm version "${base}-rc.${GITHUB_RUN_NUMBER}" --no-git-tag-version
            echo "tag=rc" >> "$GITHUB_OUTPUT"
          fi

      - name: Build plugin (and its workspace deps)
        run: yarn workspace @massif-network/smugmug build
        working-directory: .

      - name: Publish to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: yarn workspace @massif-network/smugmug npm publish --tag ${{ steps.ver.outputs.tag }}
        working-directory: .
